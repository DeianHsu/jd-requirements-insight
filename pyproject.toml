[project]
name = "jd-skill-insight"
version = "0.1.0"
description = "面向个人求职决策的岗位技能洞察系统"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
